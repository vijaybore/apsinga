<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5E34" />
      <stop offset="100%" stop-color="#063E22" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Sun Arc Aura -->
  <path d="M 28 65 A 42 42 0 0 1 92 65" fill="none" stroke="url(#goldArc)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Stylized 'A' Solar Emblem -->
  <!-- Left Leg with Lightning Bolt -->
  <path d="M 60 16 L 38 78 L 48 78 L 54 62 L 64 62 L 60 16 Z" fill="url(#leafGrad)" />
  <!-- Lightning bolt overlay on left leg -->
  <polygon points="56,38 43,62 53,62 47,82 62,56 52,56" fill="url(#boltGrad)" />

  <!-- Right Leg with Solar Grid -->
  <path d="M 60 16 L 82 78 L 72 78 L 66 62 L 56 62 L 60 16 Z" fill="url(#leafGrad)" />
  
  <!-- Solar Grid lines on right leg -->
  <!-- Horizontal lines -->
  <line x1="62" y1="36" x2="69" y2="36" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />
  <line x1="64" y1="46" x2="73" y2="46" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />
  <line x1="66" y1="56" x2="77" y2="56" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />
  <line x1="69" y1="67" x2="80" y2="67" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />
  <!-- Vertical divider on right leg -->
  <line x1="70" y1="32" x2="74" y2="72" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />

  <!-- Typography: APSINGA -->
  <text x="110" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="44" fill="#0E3D26" letter-spacing="3">APSINGA</text>
  
  <!-- Divider line with subtext -->
  <line x1="112" y1="72" x2="135" y2="72" stroke="#0E3D26" stroke-width="1.5" />
  <text x="142" y="75" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="12" fill="#0E3D26" letter-spacing="2.5">TECH INFRA SOLUTIONS</text>
  <line x1="380" y1="72" x2="405" y2="72" stroke="#0E3D26" stroke-width="1.5" />
  
  <!-- Tagline -->
  <text x="112" y="98" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="13" fill="#D97706" letter-spacing="1">CLEAN ENERGY. BRIGHT FUTURE.</text>
</svg>
